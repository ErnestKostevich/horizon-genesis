# Builds Horizon Genesis for Windows, macOS, and Linux.
#
# Tag pushes publish GitHub Releases. Manual runs build the selected ref
# (default: main) so we do not accidentally rebuild an old v1.0.0 tag.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build'
        required: true
        default: 'main'
      publish_release:
        description: 'Publish artifacts to a GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release tag to publish when publish_release=true (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            build_script: build:win
            artifact_glob: |
              dist/*.exe
              dist/*.exe.blockmap
          - os: macos-latest
            label: mac
            build_script: build:mac
            artifact_glob: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/*.zip
          - os: ubuntu-latest
            label: linux
            build_script: build:linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''

      - name: Stamp build-info.json
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_REF="${{ inputs.ref }}"
          else
            BUILD_REF="${{ github.ref_name }}"
          fi
          BUILD_SHA="$(git rev-parse HEAD)"
          cat > src/main/build-info.json <<EOF
          {
            "official": true,
            "version": "v${PKG_VERSION}",
            "ref": "${BUILD_REF}",
            "sha": "${BUILD_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner": "${{ matrix.label }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}"
          }
          EOF
          echo "----- build-info.json -----"
          cat src/main/build-info.json

      - name: Build ${{ matrix.label }}
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' && inputs.release_tag != '')
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: horizon-windows
          path: release-assets/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: horizon-mac
          path: release-assets/mac

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: horizon-linux
          path: release-assets/linux

      - name: Create / update release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Horizon Genesis ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          files: |
            release-assets/windows/*
            release-assets/mac/*
            release-assets/linux/*
          body: |
            ## Horizon Genesis ${{ env.RELEASE_TAG }}

            Desktop AI agent - local-first, BSL 1.1 source-visible, bring-your-own-keys.

            ### Downloads

            - **Windows:** `Horizon AI Setup *.exe` (x64, NSIS)
            - **macOS:** `Horizon AI-*.dmg` (Intel + Apple Silicon, unsigned; right-click Open if Gatekeeper warns)
            - **Linux:** `Horizon AI-*.AppImage` (x64, portable) or `horizon-ai_*.deb` (Debian/Ubuntu)

            Auto-generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
