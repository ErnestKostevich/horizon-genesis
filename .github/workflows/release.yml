# Builds Horizon Genesis for Windows, macOS, and Linux.
#
# Tag pushes publish GitHub Releases. Manual runs build the selected ref
# (default: main) so we do not accidentally rebuild an old v1.0.0 tag.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to build'
        required: true
        default: 'main'
      publish_release:
        description: 'Publish artifacts to a GitHub Release'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      release_tag:
        description: 'Release tag to publish when publish_release=true (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            build_script: build:win
            artifact_glob: |
              dist/*.exe
              dist/*.exe.blockmap
              dist/latest*.yml
          - os: windows-latest
            label: windows-portable
            build_script: build:win:portable
            artifact_glob: |
              dist/*.exe
          - os: macos-latest
            label: mac
            build_script: build:mac
            artifact_glob: |
              dist/*.dmg
              dist/*.dmg.blockmap
              dist/*.zip
              dist/latest*.yml
          - os: ubuntu-latest
            label: linux
            build_script: build:linux
            artifact_glob: |
              dist/*.AppImage
              dist/*.deb
              dist/latest*.yml

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      # PR-LAYOUT-V4 Fix 6 — Node 20 actions deprecated by GitHub starting
      # June 2026 (warnings in the failed macos-latest build). Updated to
      # actions/setup-node@v5 and Node 22 LTS to keep the release pipeline
      # green on macOS, Windows and Linux runners.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ''

      # PHASE 28.5 — better-sqlite3 prebuild ships a Node-ABI binary.
      # Electron has a different NODE_MODULE_VERSION so without an
      # explicit rebuild, packaged apps load a binary that can't
      # `require()` cleanly and the SQLite + FTS5 memory layer
      # silently falls back to JSON. We force-rebuild here, before
      # electron-builder packages the asar, so every release ships
      # working FTS5 on all three platforms.
      - name: Rebuild native modules for Electron ABI
        run: npx --yes @electron/rebuild -f -w better-sqlite3 -w node-pty
        # node-pty is in optionalDependencies — `-w` is best-effort and
        # won't fail the build if it's not installed for this platform
        # (Linux without prebuilt binding, etc.).
        continue-on-error: true

      - name: Stamp build-info.json
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_REF="${{ inputs.ref }}"
          else
            BUILD_REF="${{ github.ref_name }}"
          fi
          BUILD_SHA="$(git rev-parse HEAD)"
          cat > src/main/build-info.json <<EOF
          {
            "official": true,
            "version": "v${PKG_VERSION}",
            "ref": "${BUILD_REF}",
            "sha": "${BUILD_SHA}",
            "buildDate": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "runner": "${{ matrix.label }}",
            "workflow": "${{ github.workflow }}",
            "runId": "${{ github.run_id }}"
          }
          EOF
          echo "----- build-info.json -----"
          cat src/main/build-info.json

      - name: Build ${{ matrix.label }}
        run: npm run ${{ matrix.build_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: horizon-${{ matrix.label }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true' && inputs.release_tag != '')
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Download Windows artifacts
        uses: actions/download-artifact@v5
        with:
          name: horizon-windows
          path: release-assets/windows

      - name: Download Windows portable artifacts
        uses: actions/download-artifact@v5
        with:
          name: horizon-windows-portable
          path: release-assets/windows-portable

      - name: Download macOS artifacts
        uses: actions/download-artifact@v5
        with:
          name: horizon-mac
          path: release-assets/mac

      - name: Download Linux artifacts
        uses: actions/download-artifact@v5
        with:
          name: horizon-linux
          path: release-assets/linux

      - name: Create / update release with assets
        uses: softprops/action-gh-release@v2
        with:
          name: Horizon Genesis ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/windows/*
            release-assets/windows-portable/*
            release-assets/mac/*
            release-assets/linux/*
          body: |
            ## Horizon Genesis ${{ env.RELEASE_TAG }}

            Desktop AI agent - local-first, BSL 1.1 source-visible, bring-your-own-keys.

            ### Downloads

            - **Windows:** `Horizon AI Setup *.exe` (x64, NSIS)
            - **Windows portable:** `Horizon AI *.exe` (x64, no installer)
            - **macOS:** `Horizon AI-*.dmg` (Intel + Apple Silicon, unsigned; right-click Open if Gatekeeper warns)
            - **Linux:** `Horizon AI-*.AppImage` (x64, portable) or `horizon-ai_*.deb` (Debian/Ubuntu)

            Auto-generated release notes below.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Notify Discord
    needs: release
    runs-on: ubuntu-latest
    # Only fire when a real release just got published, never on
    # workflow_dispatch test runs that skipped the `release` job.
    if: ${{ always() && needs.release.result == 'success' }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Post embed to #announcements
        # Curl-based POST instead of a third-party action so we don't
        # depend on its release cycle / breaking changes. Falls back to
        # exit 0 if the secret isn't set so external forks don't fail.
        run: |
          if [ -z "${DISCORD_RELEASE_WEBHOOK}" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping notification"
            exit 0
          fi
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
          # 0xF4C95D — Horizon amber
          curl -sS -H "Content-Type: application/json" \
            -X POST "${DISCORD_RELEASE_WEBHOOK}" \
            -d @- <<JSON
          {
            "embeds": [{
              "title": "🚀 Horizon Desktop ${RELEASE_TAG}",
              "description": "A new desktop release just shipped.\\nDownload, install, and auto-update will pick it up next launch.",
              "url": "${RELEASE_URL}",
              "color": 16040029,
              "thumbnail": {"url": "https://horizonaai.dev/og-default.png"},
              "footer": {"text": "horizonaai.dev"}
            }]
          }
          JSON
        env:
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
